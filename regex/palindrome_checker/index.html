<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css"> <!-- Linking external CSS file -->
</head>
<body>
    <div class="container">
      <img src="https://cdn.freecodecamp.org/platform/universal/fcc_primary.svg"> 
      <h1>
        Is it a palindrome?
      </h1>
      <div class="input-box">
        <p class="input-label">
          Enter in text to check for a palindrome:
        </p>
        <input id="text-input" type="text">
        <button id="check-btn">check</button>
        <p id="result">
        </p>
      </div>
      <div class="explain">
        <span role="img" aria-label="light-bulb">💡</span><p>A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p>
      </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
